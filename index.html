<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JurisFlow</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14202E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JurisFlow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F7F4EE;
    --panel:#FFFFFF;
    --ink:#14202E;
    --brass:#B08D57;
    --brass-dark:#8C6F3F;
    --crimson:#8C2F39;
    --slate:#5C6470;
    --border:#DDD6C8;
    --border-soft:#EAE5D9;
    --green:#3E6B4F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--parchment);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:'Source Serif 4',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  ::selection{background:var(--brass);color:#fff;}

  /* ---- Login ---- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:32px;padding:24px;}
  .brand-mark{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .brand-mark .stamp{width:64px;height:64px;border:3px double var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);}
  .brand-mark .stamp span{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:1px;color:var(--brass-dark);}
  .brand-mark h1{font-size:34px;margin:6px 0 0;letter-spacing:0.5px;}
  .brand-mark .tagline{color:var(--slate);font-size:13px;font-style:italic;letter-spacing:0.3px;}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:32px;width:100%;max-width:380px;box-shadow:0 2px 12px rgba(20,32,46,0.06);}
  .login-card h3{margin:0 0 4px;font-size:16px;}
  .login-card p{color:var(--slate);font-size:12.5px;margin:0 0 20px;}
  .user-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;background:var(--parchment);border:1px solid var(--border-soft);border-radius:3px;text-align:left;transition:border-color .15s,background .15s;}
  .user-btn:hover{border-color:var(--brass);background:#fff;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-size:14px;flex-shrink:0;}
  .user-btn .name{font-weight:600;font-size:13.5px;}
  .user-btn .role{color:var(--slate);font-size:11.5px;}

  /* ---- App shell ---- */
  #app{display:none;min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-family:'Source Serif 4',serif;font-size:18px;letter-spacing:0.3px;}
  .topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--brass);}
  .topbar nav{display:flex;gap:4px;}
  .topbar nav button{background:none;border:none;color:#C9CFD8;padding:8px 14px;font-size:13px;font-weight:500;border-radius:3px;letter-spacing:0.2px;}
  .topbar nav button.active{color:#fff;background:rgba(255,255,255,0.09);}
  .topbar nav button:hover{color:#fff;}
  .topbar .who{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#C9CFD8;}
  .topbar .who .avatar{width:26px;height:26px;font-size:11px;}
  .topbar .logout{background:none;border:1px solid rgba(255,255,255,0.2);color:#C9CFD8;padding:5px 10px;border-radius:3px;font-size:11.5px;}

  main{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .page-head h2{font-size:24px;margin:0;}
  .page-head .sub{color:var(--slate);font-size:12.5px;margin-top:2px;}
  .btn-primary{background:var(--ink);color:#fff;border:none;padding:9px 16px;border-radius:3px;font-size:13px;font-weight:600;letter-spacing:0.2px;}
  .btn-primary:hover{background:#243449;}
  .btn-secondary{background:none;border:1px solid var(--border);color:var(--ink);padding:8px 14px;border-radius:3px;font-size:13px;}
  .btn-secondary:hover{border-color:var(--brass);}

  .grid{display:grid;gap:16px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  @media(max-width:860px){.grid-3{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--panel);border:1px solid var(--border-soft);border-radius:4px;padding:18px;}
  .card h3{margin:0 0 14px;font-size:14px;text-transform:uppercase;letter-spacing:0.6px;color:var(--slate);font-family:'IBM Plex Sans',sans-serif;font-weight:600;}
  .stat{font-family:'Source Serif 4',serif;font-size:32px;line-height:1;}
  .stat-label{color:var(--slate);font-size:12px;margin-top:4px;}

  .list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-soft);gap:10px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .primary{font-weight:600;font-size:13px;}
  .list-row .meta{color:var(--slate);font-size:11.5px;margin-top:2px;}
  .empty{color:var(--slate);font-size:12.5px;padding:16px 0;text-align:center;}

  /* Stamp badges — signature element */
  .stamp-badge{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;border:2.5px double currentColor;transform:rotate(-6deg);flex-shrink:0;}
  .stamp-badge span{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:9px;letter-spacing:0.8px;text-transform:uppercase;text-align:center;line-height:1.15;}
  .stamp-sm{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;border:1px solid currentColor;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
  .c-active{color:var(--green);} .c-pending{color:var(--brass-dark);} .c-archived{color:var(--slate);} .c-urgent{color:var(--crimson);}
  .c-todo{color:var(--slate);} .c-inprogress{color:var(--brass-dark);} .c-completed{color:var(--green);}

  .matter-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:4px;padding:16px 18px;margin-bottom:10px;display:flex;gap:16px;align-items:center;transition:border-color .15s;}
  .matter-card:hover{border-color:var(--brass);cursor:pointer;}
  .matter-card .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);}
  .matter-card h4{margin:2px 0 4px;font-size:15.5px;font-family:'Source Serif 4',serif;}
  .matter-card .meta{color:var(--slate);font-size:12px;}
  .matter-card .tags{margin-left:auto;display:flex;gap:8px;flex-shrink:0;}

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(20,32,46,0.45);z-index:50;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .modal{background:#fff;border-radius:5px;max-width:560px;width:100%;padding:26px;margin-top:10px;}
  .modal h3{margin:0 0 18px;font-size:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--slate);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:3px;font-family:inherit;font-size:13px;background:var(--parchment);}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .close-x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:20px;color:var(--slate);}

  .detail-back{color:var(--slate);font-size:12.5px;margin-bottom:12px;display:inline-block;}
  .timeline-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
  .timeline-item:last-child{border-bottom:none;}
  .timeline-dot{width:7px;height:7px;border-radius:50%;background:var(--brass);margin-top:5px;flex-shrink:0;}
  .timeline-item .txt{font-size:13px;}
  .timeline-item .when{color:var(--slate);font-size:11px;margin-top:1px;}

  .task-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft);}
  .task-row:last-child{border-bottom:none;}
  .task-check{width:18px;height:18px;border:1.5px solid var(--border);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .task-check.done{background:var(--green);border-color:var(--green);color:#fff;font-size:11px;}
  .task-row .t-title{font-size:13px;font-weight:500;}
  .task-row.done .t-title{text-decoration:line-through;color:var(--slate);}
  .task-row .t-meta{color:var(--slate);font-size:11px;margin-top:2px;}
  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;background:var(--panel);}
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .search-bar{margin-bottom:16px;}
  .search-bar input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:3px;font-size:13px;background:var(--panel);}
</style>
</head>
<body>

<div id="login-screen">
  <div class="brand-mark">
    <div class="stamp"><span>JF · EST<br>2026</span></div>
    <h1>JurisFlow</h1>
    <div class="tagline">One Firm. Every Matter. Always in Flow.</div>
  </div>
  <div class="login-card">
    <h3>Sign in</h3>
    <p>Select your profile to continue.</p>
    <div id="user-list"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>JurisFlow</div>
    <nav id="main-nav">
      <button data-page="dashboard" class="active">Dashboard</button>
      <button data-page="matters">Matters</button>
      <button data-page="tasks">Tasks</button>
      <button data-page="documents">Documents</button>
      <button data-page="research">Research</button>
      <button data-page="judgments">Judgments</button>
      <button data-page="notices">Notices</button>
      <button data-page="team">Team</button>
      <button data-page="targets">Targets</button>
      <button data-page="search">Search</button>
    </nav>
    <button class="logout" id="notif-btn" style="margin-right:10px;position:relative;">🔔 <span id="notif-count" style="display:none;background:var(--crimson);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px;"></span></button>
    <button class="logout" id="enable-notifs-btn" style="margin-right:10px;display:none;">Enable Alerts</button>
    <button class="logout" id="install-btn" style="margin-right:10px;display:none;">Install App</button>
    <div class="who">
      <span id="conn-status" class="mono" style="font-size:11px;margin-right:4px;"></span>
      <div class="avatar" id="who-avatar"></div>
      <span id="who-name"></span>
      <button class="logout" id="logout-btn">Switch user</button>
    </div>
  </div>
  <main id="main-content"></main>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-content" style="position:relative;"></div>
</div>

<script>
let USERS = [];
const DEFAULT_TEAM = [
  {id:'chetan', name:'Adv. Chetan Nagare', isAdmin:true},
  {id:'esheta', name:'Adv. Esheta Lunkad', isAdmin:false},
  {id:'sagar',  name:'Adv. Sagar Kolhatkar', isAdmin:false},
  {id:'smruti', name:'Smruti Mehta', isAdmin:false}
];
const STORE_KEY = 'jf-store';
let state = { matters: [], tasks: [], activity: [], documents: [], targets: [], notifsRead: [], research: [], notices: [], judgments: [] };
let currentUser = null;
let currentPage = 'dashboard';

function initials(name){ return name.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

let isOnline = navigator.onLine;
let pendingSync = false;
let offlineDirty = false;

function updateConnStatus(){
  const el = document.getElementById('conn-status');
  if(!el) return;
  if(isOnline){
    el.textContent = pendingSync ? '● Syncing…' : '● Online';
    el.style.color = pendingSync ? 'var(--brass)' : 'var(--green)';
  } else {
    el.textContent = '○ Offline';
    el.style.color = 'var(--crimson)';
  }
}
window.addEventListener('online', async ()=>{ isOnline = true; updateConnStatus(); if(offlineDirty) await saveStore(); });
window.addEventListener('offline', ()=>{ isOnline = false; updateConnStatus(); });

async function loadStore(){
  try{
    const res = await window.storage.get(STORE_KEY, true);
    if(res && res.value){ state = JSON.parse(res.value); }
  }catch(e){ console.log('No existing store yet, starting fresh.'); }
  state.documents = state.documents || [];
  state.targets = state.targets || [];
  state.notifsRead = state.notifsRead || [];
  state.team = (state.team && state.team.length) ? state.team : DEFAULT_TEAM.slice();
  state.research = state.research || [];
  state.notices = state.notices || [];
  state.judgments = state.judgments || [];
  USERS = state.team;
}
async function saveStore(){
  if(!isOnline){ offlineDirty = true; updateConnStatus(); return; }
  try{
    pendingSync = true; updateConnStatus();
    await window.storage.set(STORE_KEY, JSON.stringify(state), true);
    offlineDirty = false;
  }catch(e){
    console.error('Storage save failed, will retry when connection is stable', e);
    offlineDirty = true;
  } finally {
    pendingSync = false; updateConnStatus();
  }
}
// Poll for changes made by other logged-in team members so the shared workspace feels near-real-time.
setInterval(async ()=>{
  if(!isOnline || !currentUser) return;
  if(document.getElementById('modal-bg').style.display === 'flex') return; // don't disrupt active editing
  try{
    const res = await window.storage.get(STORE_KEY, true);
    if(res && res.value){
      const incoming = JSON.parse(res.value);
      incoming.documents = incoming.documents || [];
      incoming.targets = incoming.targets || [];
      incoming.notifsRead = incoming.notifsRead || [];
      incoming.team = (incoming.team && incoming.team.length) ? incoming.team : USERS;
      incoming.research = incoming.research || [];
      incoming.notices = incoming.notices || [];
      incoming.judgments = incoming.judgments || [];
      state = incoming;
      USERS = state.team;
      renderPage();
    }
  }catch(e){ /* transient — will retry on next poll */ }
}, 6000);
function logActivity(text){
  state.activity.unshift({id:uid(), text, actor: currentUser.name, ts: new Date().toISOString()});
  state.activity = state.activity.slice(0, 40);
}

// ---- Login ----
function renderLogin(){
  const list = document.getElementById('user-list');
  list.innerHTML = USERS.map(u => `
    <button class="user-btn" data-uid="${u.id}">
      <div class="avatar">${initials(u.name)}</div>
      <div><div class="name">${u.name}</div>${u.role ? `<div class="role">${u.role}</div>` : ''}</div>
    </button>`).join('');
  list.querySelectorAll('.user-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentUser = USERS.find(u=>u.id===btn.dataset.uid);
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='block';
      document.getElementById('who-avatar').textContent = initials(currentUser.name);
      document.getElementById('who-name').textContent = currentUser.name;
      updateConnStatus();
      checkAndFireNotifications();
      renderPage();
    });
  });
}
document.getElementById('logout-btn').addEventListener('click', ()=>{
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  currentUser = null;
});

// ---- Nav ----
document.getElementById('main-nav').addEventListener('click', (e)=>{
  if(e.target.tagName!=='BUTTON') return;
  document.querySelectorAll('#main-nav button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  currentPage = e.target.dataset.page;
  renderPage();
});
document.getElementById('notif-btn').addEventListener('click', ()=>{
  document.querySelectorAll('#main-nav button').forEach(b=>b.classList.remove('active'));
  currentPage = 'notifications';
  renderPage();
});
function updateNotifBadge(){
  const n = getNotifications().filter(x=>!state.notifsRead.includes(x.id));
  const el = document.getElementById('notif-count');
  if(n.length){ el.style.display='inline'; el.textContent = n.length; } else { el.style.display='none'; }
}

function renderPage(){
  const main = document.getElementById('main-content');
  if(currentPage==='dashboard') main.innerHTML = pageDashboard();
  else if(currentPage==='matters') main.innerHTML = pageMatters();
  else if(currentPage==='tasks') main.innerHTML = pageTasks();
  else if(currentPage==='matter-detail') main.innerHTML = pageMatterDetail(window.__activeMatterId);
  else if(currentPage==='documents') main.innerHTML = pageDocuments();
  else if(currentPage==='research') main.innerHTML = pageResearch();
  else if(currentPage==='judgments') main.innerHTML = pageJudgments();
  else if(currentPage==='notices') main.innerHTML = pageNotices();
  else if(currentPage==='team') main.innerHTML = pageTeam();
  else if(currentPage==='targets') main.innerHTML = pageTargets();
  else if(currentPage==='search') main.innerHTML = pageSearch();
  else if(currentPage==='notifications') main.innerHTML = pageNotifications();
  attachPageHandlers();
  updateNotifBadge();
}

// ---- Dashboard ----
function pageDashboard(){
  const today = todayStr();
  const myTasks = state.tasks.filter(t=>t.assignee===currentUser.id && t.status!=='completed');
  const overdue = myTasks.filter(t=>t.due && t.due < today);
  const dueToday = myTasks.filter(t=>t.due===today);
  const upcomingHearings = state.matters.filter(m=>m.nextHearing && m.nextHearing >= today).sort((a,b)=>a.nextHearing.localeCompare(b.nextHearing)).slice(0,5);
  const activeMatters = state.matters.filter(m=>m.status==='active').length;

  return `
    <div class="page-head">
      <div><h2>Today's Briefing</h2><div class="sub">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} — welcome back, ${currentUser.name.split(' ')[0]}</div></div>
    </div>
    <div class="grid grid-3" style="margin-bottom:16px;">
      <div class="card"><h3>Active Matters</h3><div class="stat">${activeMatters}</div><div class="stat-label">across the firm</div></div>
      <div class="card"><h3>Your Open Tasks</h3><div class="stat">${myTasks.length}</div><div class="stat-label">${dueToday.length} due today</div></div>
      <div class="card"><h3>Overdue</h3><div class="stat" style="color:${overdue.length?'var(--crimson)':'inherit'}">${overdue.length}</div><div class="stat-label">needs attention</div></div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <h3>Upcoming Hearings</h3>
        ${upcomingHearings.length ? upcomingHearings.map(m=>`
          <div class="list-row">
            <div><div class="primary">${m.title}</div><div class="meta mono">${m.matterNumber} · ${m.court||'—'}</div></div>
            <div class="stamp-sm c-urgent">${fmtDate(m.nextHearing)}</div>
          </div>`).join('') : '<div class="empty">No upcoming hearings on record.</div>'}
      </div>
      <div class="card">
        <h3>Team Activity</h3>
        ${state.activity.length ? state.activity.slice(0,8).map(a=>`
          <div class="timeline-item"><div class="timeline-dot"></div>
            <div><div class="txt"><b>${a.actor}</b> ${a.text}</div><div class="when">${new Date(a.ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>
          </div>`).join('') : '<div class="empty">No activity yet — create a matter or task to get started.</div>'}
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h3>Your Tasks Due Today / Overdue</h3>
      ${[...overdue, ...dueToday].length ? [...overdue, ...dueToday].map(t=>`
        <div class="list-row">
          <div><div class="primary">${t.title}</div><div class="meta">${t.matterId ? (state.matters.find(m=>m.id===t.matterId)?.title||'') : 'General'} · Due ${fmtDate(t.due)}</div></div>
          <span class="stamp-sm ${t.due<today?'c-urgent':'c-pending'}">${t.due<today?'Overdue':'Due Today'}</span>
        </div>`).join('') : '<div class="empty">Nothing urgent — nicely clear.</div>'}
    </div>
  `;
}

// ---- Matters ----
window.__matterFilter = 'all';
function pageMatters(){
  const f = window.__matterFilter;
  let list = state.matters;
  if(f!=='all') list = list.filter(m=>m.status===f);
  const q = (window.__matterSearch||'').toLowerCase();
  if(q) list = list.filter(m=> (m.title+m.matterNumber+m.client+m.court).toLowerCase().includes(q));

  return `
    <div class="page-head">
      <div><h2>Matters</h2><div class="sub">${state.matters.length} on file</div></div>
      <button class="btn-primary" id="new-matter-btn">+ New Matter</button>
    </div>
    <div class="search-bar"><input id="matter-search" placeholder="Search matters, clients, courts..." value="${window.__matterSearch||''}"></div>
    <div class="filters">

// ---- Notifications (derived from live data) ----
function getNotifications(){
  const today = todayStr();
  const list = [];
  state.tasks.forEach(t=>{
    if(t.status==='completed') return;
    if(t.due && t.due < today) list.push({id:'ov-'+t.id, type:'Overdue', text:`"${t.title}" is overdue`, ts:t.due});
    else if(t.due === today) list.push({id:'dt-'+t.id, type:'Due Today', text:`"${t.title}" is due today`, ts:t.due});
    if(t.assignee===currentUser.id) list.push({id:'as-'+t.id, type:'Assigned', text:`You're assigned "${t.title}"`, ts:t.due||today});
  });
  state.matters.forEach(m=>{
    if(m.nextHearing){
      const days = (new Date(m.nextHearing) - new Date(today)) / 86400000;
      if(days>=0 && days<=3) list.push({id:'hr-'+m.id, type:'Hearing', text:`Hearing for "${m.title}" on ${fmtDate(m.nextHearing)}`, ts:m.nextHearing});
    }
  });
  state.documents.forEach(d=>{
    if(d.expiry && !d.deleted){
      const days = (new Date(d.expiry) - new Date(today)) / 86400000;
      if(days>=0 && days<=7) list.push({id:'dc-'+d.id, type:'Document Expiry', text:`"${d.title}" expires ${fmtDate(d.expiry)}`, ts:d.expiry});
    }
  });
  const seen = new Set();
  return list.filter(n=> seen.has(n.id) ? false : (seen.add(n.id), true)).sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
}
function pageNotifications(){
  const list = getNotifications();
  return `
    <div class="page-head"><div><h2>Notifications</h2><div class="sub">Hearing, deadline, task and document alerts</div></div>
      <button class="btn-secondary" id="mark-all-read">Mark all read</button></div>
    <div class="card">
      ${list.length ? list.map(n=>`
        <div class="list-row">
          <div><span class="stamp-sm ${state.notifsRead.includes(n.id)?'c-todo':'c-urgent'}" style="margin-right:8px;">${n.type}</span>${n.text}</div>
          <div class="meta">${fmtDate(n.ts)}</div>
        </div>`).join('') : '<div class="empty">No notifications — all clear.</div>'}
    </div>`;
}

// ---- Installability + Real Notifications ----
let deferredInstallPrompt = null;
let swRegistration = null;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => { swRegistration = reg; })
      .catch(e => console.log('Service worker registration failed (this file may be served in a context that blocks it):', e));
  });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'inline-block';
});

function setupNotifButtons(){
  const enableBtn = document.getElementById('enable-notifs-btn');
  const installBtn = document.getElementById('install-btn');
  if ('Notification' in window && Notification.permission !== 'granted') {
    enableBtn.style.display = 'inline-block';
  }
  enableBtn.addEventListener('click', async () => {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      enableBtn.style.display = 'none';
      fireNotification('JurisFlow', 'Alerts are on — you\'ll be notified of hearings, deadlines and overdue tasks.', 'welcome');
    }
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) { alert('Use your browser\'s "Install App" or "Add to Home Screen" option from the address bar / menu.'); return; }
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.style.display = 'none';
  });
}

function fireNotification(title, body, tag){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (swRegistration) {
    swRegistration.active && swRegistration.active.postMessage({ type: 'SHOW_NOTIFICATION', title, body, tag });
  } else {
    new Notification(title, { body, icon: './icon-192.png', tag });
  }
}

// Track which alerts have already fired this session so we don't repeat them every poll.
let notifiedIds = new Set();
function checkAndFireNotifications(){
  if (!currentUser || !('Notification' in window) || Notification.permission !== 'granted') return;
  getNotifications().forEach(n => {
    if (notifiedIds.has(n.id)) return;
    notifiedIds.add(n.id);
    fireNotification(`JurisFlow — ${n.type}`, n.text, n.id);
  });
}
setInterval(checkAndFireNotifications, 60000);

function newJudgmentModal(){
  openModal(`
    <h3>Save Judgment</h3>
    <div class="field"><label>Case Title</label><input id="j-title" placeholder="e.g. K.S. Puttaswamy vs Union of India"></div>
    <div class="field-row">
      <div class="field"><label>Court</label><input id="j-court" placeholder="e.g. Supreme Court of India"></div>
      <div class="field"><label>Citation</label><input id="j-citation" placeholder="e.g. (2017) 10 SCC 1"></div>
    </div>
    <div class="field"><label>Linked Matter (optional)</label><select id="j-matter"><option value="">None</option>${state.matters.map(m=>`<option value="${m.id}">${m.title}</option>`).join('')}</select></div>
    <div class="field"><label>Notes</label><textarea id="j-notes" placeholder="Key holding, why it's relevant..."></textarea></div>
    <div class="field"><label>Judgment PDF (optional, up to ~3.5MB)</label><input type="file" id="j-file" accept="application/pdf"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancel-judgment">Cancel</button>
      <button class="btn-primary" id="save-judgment">Save Judgment</button>
    </div>`);
  document.getElementById('cancel-judgment').addEventListener('click', closeModal);
  document.getElementById('save-judgment').addEventListener('click', async ()=>{
    const title = document.getElementById('j-title').value.trim();
    if(!title){ alert('Case title is required.'); return; }
    const fileInput = document.getElementById('j-file');
    const file = fileInput.files[0];
    const saveBtn = document.getElementById('save-judgment');

    const meta = {
      id: uid(), title,
      court: document.getElementById('j-court').value.trim(),
      citation: document.getElementById('j-citation').value.trim(),
      matterId: document.getElementById('j-matter').value || null,
      notes: document.getElementById('j-notes').value.trim(),
      uploadedBy: currentUser.name, uploadedAt: todayStr(),
      hasFile: false, fileName: null
    };

    if(file){
      if(file.type !== 'application/pdf'){ alert('Please choose a PDF file.'); return; }
      if(file.size > 3.5 * 1024 * 1024){ alert('That PDF is too large for this workspace\'s current storage (~3.5MB limit). A larger-capacity version is planned.'); return; }
      saveBtn.textContent = 'Uploading...'; saveBtn.disabled = true;
      try{
        const base64 = await new Promise((res, rej)=>{
          const reader = new FileReader();
          reader.onload = ()=> res(reader.result.split(',')[1]);
          reader.onerror = ()=> rej(new Error('File read failed'));
          reader.readAsDataURL(file);
        });
        await window.storage.set('judgment-file:'+meta.id, base64, true);
        meta.hasFile = true;
        meta.fileName = file.name;
      }catch(e){
        alert('Could not upload the PDF — saving the note without it.');
      }
    }

    state.judgments.unshift(meta);
    logActivity(`saved judgment "${meta.title}"${meta.hasFile ? ' with PDF' : ''}`);
    await saveStore();
    closeModal();
    renderPage();
  });
}
async function viewJudgmentPdf(id){
  try{
    const res = await window.storage.get('judgment-file:'+id, true);
    if(!res || !res.value){ alert('PDF not found — it may not have uploaded successfully.'); return; }
    const byteChars = atob(res.value);
    const byteNumbers = new Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const blob = new Blob([new Uint8Array(byteNumbers)], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }catch(e){
    alert('Could not open the PDF.');
  }
}
